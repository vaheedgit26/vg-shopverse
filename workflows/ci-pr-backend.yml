name: PR check - backend
# Runs on feature/fix/chore branches and PRs to develop.
# Lint + test + SAST only. No Docker, no ECR, no deploy.
on:
  push:
    branches: ['feat-*', 'fix-*', 'chore-*']
    paths:
      - 'backend/**'
      - '.github/workflows/ci-pr-backend.yml'

  pull_request:
    branches: [develop]
    paths:
      - 'backend/**'
      
jobs:
  go-pr-check-job:
    uses: ./.github/workflows/_go-pr-check.yml

    permissions:
      contents: read
      pull-requests: read
      security-events: write
      actions: read

    with:
      service-name: backend
      gitleaks: true
      sonarqube-scan: true
    secrets: inherit
