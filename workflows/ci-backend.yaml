name: GO Services CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  security-events: write
  actions: read
  id-token: write

jobs:

  api-gateway:
    name: API Gateway Security Pipeline

    uses: ./.github/workflows/_go-build.yml

    with:
      service-name: backend
      gitleaks: true
      sonarqube-scan: true
      ecr-repository: shopverse/backend
      aws-region: us-east-1

    secrets: inherit
